# Conditions expérimentales — écrit par campagne.sh, ne pas éditer à la main.
# Les réglages d'analyse sont ailleurs : graphe_en/runs/<date>/graph/manifest.json

campagne: essai-blocage-02
type: panne
pilote_le: 2026-09-12T19:21:59Z

profil_demande: "25:12"
duree_prevue_min: 12
paliers_confirmes: 1
paliers_non_confirmes: 0

panne:
  cause: blocage
  intensite: defaut
  cible: automatique
  debuts_min: [3]
  duree_min: 5
  injections_confirmees: 1
  injections_non_confirmees: 0

# Réglage du consommateur (consommateur.sh etat), identique pour toutes les
# campagnes comparées entre elles.
reglage_consommateur: |
    consommateur : ts-delivery-service (3/3 répliques prêtes)
    temps de service : 140 ms de retard par échange avec la base, ≈ 700 ms par message   (appliqué)
    prefetch : 1

# Données de l'application au départ (donnees.sh etat), après remise à zéro
# sauf --sans-purge : le comportement de train-ticket en dépend.
