    orders                4 lignes
    orders_other          0 lignes
    food_order            4 lignes
    delivery              3 lignes
    commandes les plus concentrées : 2 sur D1345 le 2026-10-12
    total : 11 lignes

# Corrigee a la main apres coup : le pilote de l epoque lisait le debut dans
# la date du pod de collecte, reste d une campagne precedente (19:00). Le
# debut vrai est collecte_demarree (19:09:54) + 2 min, a la minute pleine.
