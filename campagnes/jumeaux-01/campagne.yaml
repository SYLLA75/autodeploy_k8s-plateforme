type: panne
pilote_le: 2026-09-28T12:36:47Z
interrompue: oui

profil_demande: "25:180"
duree_prevue_min: 180
paliers_confirmes: 1
paliers_non_confirmes: 0

panne:
  cause: reseau
  intensite: 400
  cible: [workers5:workers1,workers5:workers1,workers5:workers1,workers5:workers1]
  debuts_min: [5,50,95,140]
  duree_min: 20
  injections_confirmees: 1
  injections_non_confirmees: 0

# Réglage du consommateur (consommateur.sh etat), identique pour toutes les
# campagnes comparées entre elles.
reglage_consommateur: |
    consommateur : ts-delivery-service (3/3 répliques prêtes)
    temps de service : 140 ms de retard par échange avec la base, ≈ 700 ms par message   (appliqué)
    prefetch : 1

# Le même réglage relu à la fin : une panne ne doit pas l'avoir changé.
reglage_consommateur_a_la_fin: |
    consommateur : ts-delivery-service (3/3 répliques prêtes)
    temps de service : 140 ms de retard par échange avec la base, ≈ 700 ms par message   (appliqué)
    prefetch : 1

# Données de l'application au départ (donnees.sh etat), après remise à zéro
# sauf --sans-purge : le comportement de train-ticket en dépend.
donnees_au_depart: |
    orders                0 lignes
    orders_other          0 lignes
    food_order            1 lignes
    delivery              1 lignes
    total : 2 lignes
    limite CPU de ts-order-service : 2
    tas Java de ts-order-service : celui de l'image (200m)

# Leader de la base (panne.sh leader) : le graphe figé suppose tsdb-mysql-0.
leader_base:
  au_depart: "role=leader, adresse 10.233.125.4, tsdb-mysql-leader → 10.233.125.4"
  a_la_fin: "role=leader, adresse 10.233.125.4, tsdb-mysql-leader → 10.233.125.4"

