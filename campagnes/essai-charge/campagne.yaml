    orders                1 lignes
    orders_other          0 lignes
    food_order            6 lignes
    delivery              6 lignes
    commandes les plus concentrées : 1 sur D1345 le 2026-09-18
    total : 13 lignes

# Calculée par le pilote : mise en route de la collecte + marge → fin − marge.
